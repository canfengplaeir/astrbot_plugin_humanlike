<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>话题偏好</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <div class="page-hd">
      <h2>话题偏好</h2>
      <p>偏好作为上下文提示，帮助机器人判断是否适合参与当前讨论</p>
    </div>

    <div class="card">
      <h3>手动添加</h3>
      <p class="hint">添加希望机器人关注的话题或短语</p>
      <div class="input-row">
        <input type="text" id="manualInput" placeholder="输入话题或短语，回车添加" />
        <button class="btn btn-primary" id="addBtn">添加</button>
      </div>
      <div class="tags" id="manualTags"></div>
      <div class="actions">
        <button class="btn-ghost" id="clearManual">清空手动</button>
        <span style="font-size:12px;color:var(--muted)" id="manualCount"></span>
      </div>
    </div>

    <div class="card">
      <h3>AI 生成话题</h3>
      <p class="hint">选择人格，AI 根据人格设定生成相关话题偏好</p>
      <div class="input-row">
        <select id="personaSelect"><option value="">加载中...</option></select>
        <button class="btn btn-primary" id="genBtn">生成</button>
      </div>
      <div class="tags" id="aiTags"></div>
      <div class="actions">
        <button class="btn-ghost" id="clearAi">清空 AI</button>
        <span style="font-size:12px;color:var(--muted)" id="aiCount"></span>
      </div>
      <div class="status-line" id="genStatus"></div>
    </div>

    <div class="card">
      <h3>匹配预览</h3>
      <p class="hint">输入一段消息，查看会命中哪些话题偏好</p>
      <div class="input-row">
        <input type="text" id="testInput" placeholder="输入测试消息..." />
        <button class="btn btn-primary" id="testBtn">测试</button>
      </div>
      <div class="status-line" id="testResult"></div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
