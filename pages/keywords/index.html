<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>关键词管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>📋 关键词管理</h2>
      <p>机器人会对包含这些关键词的消息更感兴趣，更愿意参与群聊讨论</p>
    </div>

    <div class="card">
      <h3>✏️ 手动配置</h3>
      <p class="hint">手动添加你希望机器人关注的关键词</p>
      <div class="input-row">
        <input type="text" id="manualInput" placeholder="输入关键词，回车或点击添加" />
        <button class="btn btn-primary" id="addBtn">添加</button>
      </div>
      <div class="tags" id="manualTags"></div>
      <div class="actions">
        <button class="btn btn-text" id="clearManual">清空全部</button>
        <span style="font-size:12px;color:var(--text-secondary)" id="manualCount"></span>
      </div>
    </div>

    <div class="card">
      <h3>🤖 AI 生成关键词</h3>
      <p class="hint">选择一个人格，AI 将根据该人格设定自动生成相关话题关键词</p>
      <div class="input-row">
        <select id="personaSelect" style="flex:1">
          <option value="">加载中...</option>
        </select>
        <button class="btn btn-primary" id="genBtn">🤖 生成</button>
      </div>
      <div class="tags" id="aiTags"></div>
      <div class="actions">
        <button class="btn btn-text" id="clearAi">清空 AI 关键词</button>
        <span style="font-size:12px;color:var(--text-secondary)" id="aiCount"></span>
      </div>
      <div id="genStatus" class="status"></div>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
